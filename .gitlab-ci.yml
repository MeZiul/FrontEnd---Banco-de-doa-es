stages:
  - validate

default:
  image: node:24-alpine

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

validate:
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - npm ci
    - node --test tests/*.test.mjs
    - npm run lint
    - npm run build
  variables:
    NEXT_PUBLIC_API_URL: "https://doai.app.fslab.dev"
