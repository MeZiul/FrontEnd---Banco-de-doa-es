services:
  frontend:
    image: ${DOAI_FRONTEND_IMAGE:?Defina a imagem revisada do frontend}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-}
    ports:
      - "80:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1001,gid=1001
      - /app/.next/cache:rw,nosuid,size=64m,uid=1001,gid=1001
